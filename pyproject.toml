[project]
name = "ecg-arrhythmia-pytorch"
version = "0.1.0"
description = "ECG heartbeat classification on MIT-BIH with an honest inter-patient split"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "wfdb>=4.1",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
